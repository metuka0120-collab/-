<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | デュエマプレイス 参加型配信ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎴</text></svg>">
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<header class="topbar">
  <h1>デュエマプレイス 参加型配信ツール</h1>
  <div class="topbar-right">
    <a class="overlay-link" href="/overlay" target="_blank" rel="noopener">OBS表示画面を開く</a>
    <span id="conn" class="conn conn-off">接続中…</span>
  </div>
</header>

<main class="layout">

  <!-- 左カラム -->
  <div class="col">

    <section class="card">
      <h2>参加者を登録</h2>
      <form id="add-form" class="add-form" autocomplete="off">
        <label>
          <span>リスナー名</span>
          <input id="add-name" type="text" placeholder="例）でゅえまくん" maxlength="40" required>
        </label>
        <label>
          <span>使用デッキ名</span>
          <input id="add-deck" type="text" placeholder="例）赤単我我我" maxlength="40">
        </label>
        <button type="submit" class="btn btn-primary">待機列に追加</button>
      </form>
      <p id="add-error" class="error" hidden></p>
    </section>

    <section class="card">
      <h2>現在の対戦者</h2>
      <div id="current-area"></div>
    </section>

    <section class="card">
      <h2>本日の成績</h2>
      <div class="stats" id="stats">
        <div class="stat stat-win"><span class="stat-label">勝利</span><span class="stat-value" id="stat-win">0</span></div>
        <div class="stat stat-lose"><span class="stat-label">敗北</span><span class="stat-value" id="stat-lose">0</span></div>
        <div class="stat"><span class="stat-label">試合数</span><span class="stat-value" id="stat-total">0</span></div>
        <div class="stat stat-rate"><span class="stat-label">勝率</span><span class="stat-value" id="stat-rate">0%</span></div>
      </div>
      <p class="hint" id="stat-date"></p>
    </section>

  </div>

  <!-- 右カラム -->
  <div class="col">

    <section class="card">
      <h2>参加待機列 <span class="count" id="queue-count">0</span></h2>
      <ul id="queue-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>対戦履歴 <span class="count" id="history-count">0</span></h2>
      <div class="history-tools">
        <label class="checkbox">
          <input type="checkbox" id="history-today-only" checked>
          <span>本日のみ表示</span>
        </label>
        <button type="button" class="btn btn-ghost btn-small" id="clear-today">本日の履歴をリセット</button>
      </div>
      <ul id="history-list" class="list"></ul>
    </section>

  </div>
</main>

<script src="/admin.js"></script>
</body>
</html>
