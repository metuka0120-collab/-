<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まとめ画像 | デュエマプレイス 配信ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎴</text></svg>">
<link rel="stylesheet" href="/admin.css">
<link rel="stylesheet" href="/summary.css">
</head>
<body>

<header class="topbar">
  <h1>まとめ画像をつくる</h1>
  <div class="topbar-right">
    <a class="link" href="/admin">対戦記録画面にもどる</a>
    <span id="conn" class="conn conn-off">接続中…</span>
  </div>
</header>

<main class="sum-layout">

  <section class="card sum-side">
    <h2>画像の設定</h2>

    <div class="form">
      <label class="field">
        <span>どの日の成績にしますか</span>
        <select id="o-day"></select>
      </label>

      <label class="field">
        <span>色</span>
        <select id="o-theme">
          <option value="dark">ダーク（黒背景）</option>
          <option value="light">ライト（白背景）</option>
        </select>
      </label>

      <label class="field">
        <span>並べ方</span>
        <select id="o-cols">
          <option value="auto">自動（多いときは2列）</option>
          <option value="1">1列</option>
          <option value="2">2列</option>
        </select>
      </label>

      <label class="check"><input type="checkbox" id="o-comment" checked> 試合の感想を入れる</label>
      <label class="check"><input type="checkbox" id="o-myname"> 自分の名前を入れる</label>
      <label class="check"><input type="checkbox" id="o-mydeck"> 自分のデッキを入れる</label>
      <label class="check"><input type="checkbox" id="o-stamps" checked> スタンプを入れる</label>
      <label class="check"><input type="checkbox" id="o-icons" checked> リスナーのアイコンを入れる</label>
      <label class="check"><input type="checkbox" id="o-h2h"> リスナーとの通算成績を入れる</label>

      <label class="field">
        <span>タイトル</span>
        <input type="text" id="o-title" maxlength="40" placeholder="視聴者参加型対戦">
      </label>

      <label class="field">
        <span>フォント</span>
        <select id="o-font">
          <option value="gothic">ゴシック（標準）</option>
          <option value="ud">UDゴシック（太め・見やすい）</option>
          <option value="mincho">明朝</option>
          <option value="kyokasho">教科書体</option>
        </select>
      </label>

      <label class="field">
        <span>アクセント色</span>
        <select id="o-accent">
          <option value="blue">青むらさき（標準）</option>
          <option value="red">レッド</option>
          <option value="green">グリーン</option>
          <option value="pink">ピンク</option>
          <option value="orange">オレンジ</option>
          <option value="mono">モノトーン</option>
        </select>
      </label>

      <label class="field">
        <span>ひとこと（画像の下に入ります・空欄可）</span>
        <input type="text" id="o-note" maxlength="60" placeholder="例）参加ありがとうございました！">
      </label>

      <label class="field">
        <span>ひとことの大きさ <b id="o-note-size-label">22</b> px</span>
        <input type="range" id="o-note-size" min="14" max="48" step="1" value="22">
      </label>
    </div>

    <h2 class="sec">背景とキャラ画像</h2>
    <div class="form">
      <label class="field">
        <span>背景画像</span>
        <select id="o-bg"><option value="">なし</option></select>
      </label>

      <div id="bg-opts" hidden>
        <label class="field">
          <span>背景の濃さ <b id="o-bg-op-label">35</b> %</span>
          <input type="range" id="o-bg-opacity" min="0" max="100" step="5" value="35">
        </label>
        <label class="field">
          <span>合わせ方</span>
          <select id="o-bg-fit">
            <option value="cover">全体を覆う（はみ出す）</option>
            <option value="contain">全体を入れる（余白が出る）</option>
            <option value="tile">タイル状にしきつめる</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>キャラ画像を追加</span>
        <select id="o-char-add"><option value="">選んで追加…</option></select>
      </label>

      <div id="char-list"></div>
      <p class="hint">キャラ画像は<strong>画像の上をドラッグ</strong>して動かせます。</p>

      <button type="button" class="btn btn-ghost btn-sm" id="images-reload">↻ 画像フォルダを読み込み直す</button>
    </div>

    <div class="sum-actions">
      <button type="button" class="btn btn-primary" id="download">PNG画像として保存</button>
      <button type="button" class="btn btn-ghost" id="copy">クリップボードにコピー</button>
    </div>
    <p class="hint" id="msg">保存した画像は、そのままX（Twitter）に貼り付けられます。</p>
  </section>

  <section class="card sum-main">
    <h2>できあがり <span class="count" id="size-label">-</span></h2>
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
    </div>
    <p class="hint">この画像がそのまま保存されます。スクショを撮る場合はこの枠を撮ってください。</p>
  </section>

</main>

<script src="/summary.js"></script>
</body>
</html>
