<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まとめ画像 | デュエマプレイス 配信ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎴</text></svg>">
<link rel="stylesheet" href="/admin.css">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/summary.css">
</head>
<body>

<header class="topbar">
  <h1>まとめ画像をつくる</h1>
  <div class="topbar-right">
    <a class="link" href="/admin">対戦記録画面にもどる</a>
    <span id="conn" class="conn conn-off">接続中…</span>
  </div>
</header>

<main class="sum-layout">

  <section class="card sum-side">
    <h2>デザイン</h2>
    <div class="theme-grid" id="theme-grid"></div>

    <label class="field" id="accent-field" hidden>
      <span>アクセント色</span>
      <select id="o-accent">
        <option value="blue">青むらさき（標準）</option>
        <option value="red">レッド</option>
        <option value="green">グリーン</option>
        <option value="pink">ピンク</option>
        <option value="orange">オレンジ</option>
        <option value="mono">モノトーン</option>
      </select>
    </label>

    <h2 class="sec">文字のフォントと大きさ</h2>
    <p class="hint">変えたい場所を選んでから、フォントや大きさを選んでください。</p>
    <div class="part-tabs" id="part-tabs"></div>

    <div class="part-panel">
      <label class="field">
        <span><b id="part-name">タイトル</b>の大きさ <b id="part-size-label">100</b> %</span>
        <input type="range" id="part-size" min="50" max="250" step="5" value="100">
      </label>

      <div class="font-grid" id="font-grid"></div>

      <div class="custom-font">
        <span class="custom-font-label">PCに入っているフォントを使う</span>
        <div class="custom-font-row">
          <input type="text" id="custom-font" list="custom-font-list" maxlength="40" placeholder="例）HGP創英角ﾎﾟｯﾌﾟ体">
          <button type="button" class="btn btn-ghost btn-sm" id="custom-font-use">使う</button>
        </div>
        <datalist id="custom-font-list"></datalist>
        <button type="button" class="btn btn-ghost btn-sm" id="local-fonts" hidden>PCのフォント一覧を読み込む</button>
        <p class="hint" id="custom-font-hint">フォント名はWordなどのフォント欄に出る名前をそのまま入れてください。</p>
      </div>

      <div class="part-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="font-all">このフォントを全部の文字に使う</button>
        <button type="button" class="btn btn-ghost btn-sm" id="font-reset">テーマのおすすめに戻す</button>
      </div>
    </div>

    <h2 class="sec">画像の中身</h2>
    <div class="form">
      <label class="field">
        <span>どの日の成績にしますか</span>
        <select id="o-day"></select>
      </label>

      <label class="field">
        <span>並べ方</span>
        <select id="o-cols">
          <option value="auto">自動（多いときは2列）</option>
          <option value="1">1列</option>
          <option value="2">2列</option>
        </select>
      </label>

      <label class="check"><input type="checkbox" id="o-deck" checked> 相手のデッキを入れる</label>
      <label class="check"><input type="checkbox" id="o-comment" checked> 試合の感想を入れる</label>
      <label class="check"><input type="checkbox" id="o-myname"> 自分の名前を入れる</label>
      <label class="check"><input type="checkbox" id="o-mydeck"> 自分のデッキを入れる</label>
      <label class="check"><input type="checkbox" id="o-stamps" checked> スタンプを入れる</label>
      <label class="check"><input type="checkbox" id="o-icons" checked> リスナーのアイコンを入れる</label>
      <label class="check"><input type="checkbox" id="o-h2h"> リスナーとの通算成績を入れる</label>

      <label class="field">
        <span>タイトル</span>
        <input type="text" id="o-title" maxlength="40" placeholder="視聴者参加型対戦">
      </label>

      <label class="field">
        <span>ひとこと（画像の下に入ります・空欄可）</span>
        <input type="text" id="o-note" maxlength="60" placeholder="例）参加ありがとうございました！">
      </label>
    </div>

    <h2 class="sec">背景とキャラ画像</h2>
    <div class="form">
      <label class="field">
        <span>背景画像</span>
        <select id="o-bg"><option value="">なし</option></select>
      </label>

      <div id="bg-opts" hidden>
        <label class="field">
          <span>背景の濃さ <b id="o-bg-op-label">35</b> %</span>
          <input type="range" id="o-bg-opacity" min="0" max="100" step="5" value="35">
        </label>
        <label class="field">
          <span>合わせ方</span>
          <select id="o-bg-fit">
            <option value="cover">全体を覆う（はみ出す）</option>
            <option value="contain">全体を入れる（余白が出る）</option>
            <option value="tile">タイル状にしきつめる</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>キャラ画像を追加</span>
        <select id="o-char-add"><option value="">選んで追加…</option></select>
      </label>

      <div id="char-list"></div>
      <p class="hint">キャラ画像は<strong>画像の上をドラッグ</strong>して動かせます。</p>

      <button type="button" class="btn btn-ghost btn-sm" id="images-reload">↻ 画像フォルダを読み込み直す</button>
    </div>

    <div class="sum-actions">
      <button type="button" class="btn btn-primary" id="download">PNG画像として保存</button>
      <button type="button" class="btn btn-ghost" id="copy">クリップボードにコピー</button>
    </div>
    <p class="hint" id="msg">保存した画像は、そのままX（Twitter）に貼り付けられます。</p>
  </section>

  <section class="card sum-main">
    <h2>できあがり <span class="count" id="size-label">-</span></h2>
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
    </div>
    <p class="hint">この画像がそのまま保存されます。スクショを撮る場合はこの枠を撮ってください。</p>
  </section>

</main>

<script src="/font-list.js"></script>
<script src="/summary-themes.js"></script>
<script src="/summary.js"></script>
</body>
</html>
